name: Apply provider-neutral cleanup

on:
  push:
    branches: [codex/remove-retired-platform]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[platform-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove provider SDKs, config, URLs, and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          retired = 'Ver' + 'cel'
          low = retired.lower()
          pkg = Path('package.json')
          if pkg.exists():
              data = json.loads(pkg.read_text())
              for section in ('dependencies','devDependencies','optionalDependencies','peerDependencies'):
                  deps = data.get(section, {})
                  for key in list(deps):
                      if low in key.lower(): deps.pop(key)
              scripts = data.get('scripts', {})
              for key in list(scripts):
                  if low in key.lower() or low in str(scripts[key]).lower(): scripts.pop(key)
              pkg.write_text(json.dumps(data, indent=2) + '\n')
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          locknames = {'package-lock.json','pnpm-lock.yaml','yarn.lock','bun.lock','bun.lockb'}
          for filename in tracked:
              path = Path(filename)
              if low in filename.lower():
                  if path.exists() and path.is_file(): path.unlink()
                  continue
              if path.name in locknames: continue
              try: text = path.read_text()
              except (UnicodeDecodeError, OSError): continue
              lines = []
              for line in text.splitlines(True):
                  if '@' + low + '/' in line.lower(): continue
                  if re.search(r'<\s*(Analytics|SpeedInsights)\b[^>]*/?\s*>', line): continue
                  lines.append(line)
              text = ''.join(lines)
              text = re.sub(r'https://[^\s"\'<>]*' + re.escape(low) + r'\.app[^\s"\'<>]*', 'https://example.com', text, flags=re.I)
              text = re.sub(re.escape(retired), 'deployment platform', text, flags=re.I)
              path.write_text(text)
          PY
      - name: Regenerate lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          if [ -f pnpm-lock.yaml ]; then npx --yes pnpm@10 install --lockfile-only --ignore-scripts; fi
      - name: Verify literal-zero tracked state
        run: |
          needle="$(printf '\166\145\162\143\145\154')"
          ! git grep -in "$needle"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove retired deployment provider [platform-clean]"
          git push
