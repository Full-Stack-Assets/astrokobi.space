name: Repair cleanup runner

on:
  push:
    branches:
      - agent/remove-platform-coupling

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rebuild dependency lock from the cleaned manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-platform-cleanup.yml')
          text = path.read_text()
          old = '          npm install --package-lock-only --ignore-scripts --no-audit --no-fund\n'
          new = '          rm -f package-lock.json\n          npm install --package-lock-only --ignore-scripts --no-audit --no-fund\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected lockfile command not found')
              path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-cleanup-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair cleanup lockfile regeneration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
